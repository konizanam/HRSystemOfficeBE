<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f9fafb;
      color: #111827;
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-collapse: collapse;
      "
    >
      <tr>
        <td
          style="padding: 16px 24px; border-bottom: 3px solid {{accentColour}}; font-size: 16px; font-weight: 600"
        >
          PeopleHub
        </td>
      </tr>
      <tr>
        <td style="padding: 24px; line-height: 1.5">{{{content}}}</td>
      </tr>
      <tr>
        <td style="padding: 16px 24px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 12px">
          This is an automated message from PeopleHub. Please do not reply.
        </td>
      </tr>
    </table>
  </body>
</html>
