# Local stack: postgres, mailpit, minio, api and web.
# The web image is built from the sibling HRSystemOfficeFE repository (../HRSystemOfficeFE).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./scripts/db-roles.sql:/scripts/db-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025', '1025:1025']

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app_user:app_user@postgres:5432/peoplehub
      MIGRATION_DATABASE_URL: postgresql://app_owner:app_owner@postgres:5432/peoplehub
      WEB_ORIGIN: http://localhost:8080
      PUBLIC_URL: http://localhost:8080
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
      ENCRYPTION_ACTIVE_KEY: ${ENCRYPTION_ACTIVE_KEY:-k1}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      MAIL_FROM: PeopleHub <noreply@peoplehub.local>
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: peoplehub
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      COOKIE_SECURE: 'false'
    ports: ['3000:3000']

  web:
    build: { context: ../HRSystemOfficeFE, dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ['8080:8080']

volumes:
  pgdata:
  minio:
